name: Vérification du code avec PHP CS Fixer     # Nom du workflow
on:
  push:
    branches: [ main ]                           # Déclenché lors d’un push sur la branche main
  pull_request:
    branches: [ main ]                           # Déclenché lors d’une pull request vers main

jobs:
  cs-fixer:                                      # Nom du job
    runs-on: ubuntu-latest                       # Exécution sur la dernière version d’Ubuntu
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v2                # Télécharge le contenu du dépôt

      - name: Installer PHP
        uses: shivammathur/setup-php@v2          # Installe PHP sur la machine virtuelle
        with:
          php-version: '8.3'                  

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-progress --no-suggest  # Installe les dépendances avec Composer

      - name: Vérifier le style du code
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no .  # Vérifie la conformité PSR-12 sans modifier les fichiers